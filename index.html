<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content">
<title>폰 타자 연습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 조용하고 정돈된 — 좋은 필기구처럼 군더더기 없이
   IDEA: 잘 만든 원고 위에 내 글자가 한 자씩 얹히는 느낌
   PICTURE: 명조체로 크게 놓인 연습 문장, 친 만큼 색이 바뀌고 커서가 따라온다
   COLOUR and TYPE: 차가운 흰 바탕 + 먹색 글씨 + 파랑 하나 / 연습 문장은 고운바탕, 나머지는 Noto Sans KR
   LAYOUT: 한 화면 한 가지 일. 얇은 선과 넉넉한 여백, 자판이 올라와도 입력칸이 보이게 */
:root{color-scheme:light dark;--bg:light-dark(#f4f5f7,#0e0f13);--card:light-dark(#ffffff,#17191f);--ink:light-dark(#14161c,#eceef3);--muted:light-dark(#6b7080,#8b90a0);--line:light-dark(#e3e5ea,#262a33);--soft:light-dark(#eef0f4,#1e2129);--acc:light-dark(#3355ff,#8197ff);--ok:light-dark(#11865b,#4cc995);--bad:light-dark(#d93c2e,#ff8577)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
.app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:0 18px}
.view{flex:1;display:flex;flex-direction:column;gap:16px;padding:18px 0 20px}
.view[hidden]{display:none}
.serif{font-family:"Gowun Batang",serif}
h1{font:700 34px/1.1 "Noto Sans KR",sans-serif;letter-spacing:-.03em;margin:14px 0 0}
.lead{margin:0;color:var(--muted);font-size:16px}
.hero{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px 22px 18px}
.hero .line{font:700 clamp(24px,6.4vw,30px)/1.5 "Gowun Batang",serif;word-break:keep-all}
.hero .line i{font-style:normal;color:var(--ok)}
.hero .line u{text-decoration:none;color:var(--muted)}
.caret{display:inline-block;width:2px;height:1.05em;background:var(--acc);vertical-align:-.15em;margin:0 1px;animation:bl 1.1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.hero .meta{display:flex;gap:18px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);color:var(--muted);font-size:14px}
.hero .meta b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.list{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:16px 20px;min-height:72px;color:var(--ink);font:inherit;cursor:pointer}
.row:first-child{border-top:0}
.row:hover{background:var(--soft)}
.row b{display:block;font-weight:500;font-size:17px}
.row small{display:block;color:var(--muted);font-size:14px;line-height:1.45}
.row em{font-style:normal;color:var(--muted);font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.row em::after{content:"›";margin-left:10px;font-size:20px;vertical-align:-1px}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.top .t{font-weight:500;font-size:16px;text-align:center;white-space:nowrap}
.top .r{justify-self:end;color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.back{justify-self:start;background:none;border:0;color:var(--muted);font:16px "Noto Sans KR",sans-serif;min-height:44px;padding:0 4px;cursor:pointer}
.prog{height:3px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:-8px}
.prog i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}
.target{background:var(--card);border-radius:22px;border:1px solid var(--line);padding:26px 22px;font:700 clamp(24px,6.6vw,31px)/1.6 "Gowun Batang",serif;word-break:keep-all;overflow-wrap:anywhere;transition:border-color .2s}
.target span{border-radius:3px}
.target .ok{color:var(--ok)}
.target .bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.target .cur{box-shadow:inset 2px 0 0 var(--acc)}
.target.done{border-color:var(--ok)}
.target .hid{color:var(--line)}
.btn.ghost{background:var(--soft);color:var(--ink);min-height:44px;font-size:15px;padding:0 16px;border-radius:12px}
.btn.ghost[hidden]{display:none}
.rowc{display:flex;align-items:center;justify-content:space-between;gap:10px}
.rowc .tog{flex:1}
.note{font-size:14px;color:var(--bad);margin:0}
.src{margin:-8px 4px 0;text-align:right;color:var(--muted);font-size:14px}
.typebox{display:flex;gap:8px}
input[type=text]{flex:1;font:18px "Noto Sans KR",sans-serif;padding:0 18px;min-height:56px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s}
input[type=text]:focus{border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 18%,transparent)}
input::placeholder{color:var(--muted)}
.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.btn{font:500 17px/1 "Noto Sans KR",sans-serif;color:var(--bg);background:var(--ink);border:0;border-radius:16px;padding:0 22px;min-height:56px;cursor:pointer;white-space:nowrap}
.btn.wide{width:100%}
button:focus-visible,label:focus-within{outline:2px solid var(--acc);outline-offset:3px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);padding-top:14px}
.stat small{display:block;color:var(--muted);font-size:13px}
.stat b{font:500 26px/1.2 "Noto Sans KR",sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat+.stat{padding-left:14px;border-left:1px solid var(--line)}
.hint{font-size:14px;color:var(--muted);margin:0}
.result{display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;padding-top:10vh}
.result h2{font:500 18px "Noto Sans KR",sans-serif;margin:0;color:var(--muted)}
.big{font:700 72px/1 "Noto Sans KR",sans-serif;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.big small{font-size:24px;font-weight:500;margin-left:4px;color:var(--muted)}
.result .stats{width:100%;text-align:left}
.seg{display:flex;background:var(--soft);border-radius:14px;padding:4px}
.seg label{flex:1;text-align:center;min-height:42px;display:flex;align-items:center;justify-content:center;border-radius:10px;cursor:pointer;font-size:15px;color:var(--muted)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--card);color:var(--ink);font-weight:500;box-shadow:0 1px 3px #0002}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips[hidden],.tog[hidden]{display:none}
.chips button{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--muted);font:15px "Noto Sans KR",sans-serif;cursor:pointer}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.jamo{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;display:grid;grid-template-columns:minmax(0,1.4fr) auto minmax(0,.7fr);gap:10px;align-items:center;min-height:150px}
.jamo .ch{grid-column:2;font:500 88px/1 "Noto Sans KR",sans-serif;transition:color .15s}
.jamo .ch.okf{color:var(--ok)}.jamo .ch.badf{color:var(--bad)}
.jamo .side{font-size:14px;color:var(--muted);line-height:1.5}
.jamo .side.r{text-align:right;font-variant-numeric:tabular-nums}
.jamo .side b{display:block;color:var(--ink);font-weight:500;font-size:15px}
.kb{display:flex;flex-direction:column;gap:6px;background:var(--soft);border-radius:18px;padding:10px 6px;transition:opacity .2s}
.kb.off{opacity:0;pointer-events:none;height:0;padding:0;overflow:hidden}
.kr{display:flex;gap:5px;justify-content:center}
.k{flex:1;max-width:46px;height:44px;border-radius:9px;background:var(--card);display:grid;place-items:center;font:500 17px "Noto Sans KR",sans-serif;box-shadow:0 1px 0 var(--line);color:var(--ink)}
.kbrow{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--muted)}.kbrow[hidden]{display:none}.kbrow span{flex:none}
.k.num{background:none;box-shadow:none;height:28px;font-size:14px;color:var(--muted)}
.k.wd{max-width:56px;color:var(--muted)}
.k.hl{background:var(--acc);color:#fff;box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 30%,transparent)}
.kb.cj{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:10px}
.kb.cj .k{max-width:none;height:48px}
.kb.cj .k.e{visibility:hidden}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:15px;color:var(--muted);min-height:44px;cursor:pointer}
.tog input{appearance:none;width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .2s;margin:0}
.tog input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px #0003}
.tog input:checked{background:var(--acc)}.tog input:checked::after{transform:translateX(18px)}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px 20px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.qtag{font-size:13px;color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent);border-radius:999px;padding:2px 12px}
.qtext{font:700 22px/1.45 "Gowun Batang",serif;word-break:keep-all;min-height:1.5em}
.qtext.cho{font:700 clamp(40px,12vw,56px)/1.1 "Noto Sans KR",sans-serif;letter-spacing:.12em}
.qfb{margin:0;font-size:15px;color:var(--muted);min-height:1.5em}
.qfb.ok{color:var(--ok)}.qfb.bad{color:var(--bad)}
.qcard .btn[hidden]{display:none}
.sky{position:relative;flex:1;min-height:220px;border-radius:22px;overflow:hidden;background:linear-gradient(light-dark(#e9edff,#151a2e),light-dark(#ffffff,#0e0f13));border:1px solid var(--line)}
.word{position:absolute;left:0;top:0;padding:5px 14px;border-radius:999px;background:var(--card);color:var(--ink);border:1px solid var(--line);font:500 19px/1.3 "Noto Sans KR",sans-serif;white-space:nowrap;box-shadow:0 2px 6px #0000000f;will-change:transform}
.word.near{border-color:var(--bad);color:var(--bad)}
.word.pre{background:var(--acc);color:#fff;border-color:var(--acc)}
.ground{position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--bad);opacity:.6}
.pop{position:absolute;font:500 18px "Noto Sans KR",sans-serif;color:var(--ok);pointer-events:none;animation:up .8s forwards}
.pop.bad{color:var(--bad)}
@keyframes up{to{transform:translateY(-36px);opacity:0}}
.cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;background:color-mix(in srgb,var(--card) 88%,transparent)}
.cover[hidden]{display:none}
.cover h2{font:700 24px/1.2 "Noto Sans KR",sans-serif;margin:0;letter-spacing:-.02em}
.hearts{color:var(--bad);letter-spacing:3px;justify-self:end}
@media(prefers-reduced-motion:reduce){.shake,.pop,.caret{animation:none}.prog i{transition:none}}
</style>
</head>
<body>
<div class="app">

<section class="view" id="home">
  <h1>폰 타자 연습</h1>
  <p class="lead">평소 쓰는 휴대폰 자판 그대로, 천천히 정확하게.</p>
  <div class="hero" aria-hidden="true">
    <div class="line"><i>가는 말이 고와야</i><span class="caret"></span><u> 오는 말이 곱다.</u></div>
    <div class="meta"><span>타수 <b>164</b></span><span>정확도 <b>98%</b></span><span>예시 화면</span></div>
  </div>
  <div class="list">
    <button class="row" data-go="msg"><span><b>문자 연습</b><small>안부, 약속, 가족, 단체방 등 상황별 카톡 말</small></span><em id="rec-msg"></em></button>
    <button class="row" data-go="prose"><span><b>짧은 글 연습</b><small>조금 긴 문장으로 손 풀기</small></span><em id="rec-prose"></em></button>
    <button class="row" data-go="quote"><span><b>속담·명언·성경</b><small>오래 남은 좋은 말 따라 치기</small></span><em id="rec-quote"></em></button>
    <button class="row" data-go="sym"><span><b>기호 연습</b><small>! ~ ^^ ♥ # 내 폰에서 찾아 치기</small></span><em id="rec-sym"></em></button>
    <button class="row" data-go="pos"><span><b>자리 연습</b><small>자판 자리를 익혀 안 보고 치기</small></span><em id="rec-pos"></em></button>
    <button class="row" data-go="rain"><span><b>낱말 퀴즈</b><small>상식·속담·채팅 말 문제를 보고 빨리 쳐서 맞히기</small></span><em id="rec-rain"></em></button>
  </div>
</section>

<section class="view" id="prac" hidden>
  <div class="top"><button class="back" data-home>‹ 처음으로</button><span class="t" id="pTitle">문자 연습</span><span class="r" id="pStep">1 / 8</span></div>
  <div class="prog"><i id="pBar"></i></div>
  <div class="chips" id="cats" hidden></div>
  <div class="target" id="target"></div>
  <p class="src" id="src"></p>
  <form class="typebox" id="pForm">
    <input type="text" id="pIn" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="next" aria-label="여기에 따라 치세요" placeholder="여기에 따라 치세요">
    <button class="btn" type="submit">다음</button>
  </form>
  <div class="stats">
    <div class="stat"><small>타수 (분당)</small><b id="sSpeed">0</b></div>
    <div class="stat"><small>정확도</small><b id="sAcc">100%</b></div>
    <div class="stat"><small>시간</small><b id="sTime">0초</b></div>
  </div>
  <div class="rowc"><label class="tog">듣고 받아쓰기<input type="checkbox" id="pSnd"></label><button type="button" class="btn ghost" id="pRep" hidden>다시 듣기</button></div>
  <div class="kbrow" id="kbP" hidden><span>내 자판</span><div class="chips kbc"></div></div>
  <label class="tog" id="npWrap">문장 부호 빼고 연습하기 (. , ! ? ~)<input type="checkbox" id="noPunct"></label>
  <p class="note" id="pNote" hidden></p>
  <p class="hint">다 맞게 치면 저절로 다음 문장으로 넘어가요. 문장 부호 자리는 폰마다 달라서, 어려우면 위 스위치를 켜세요.</p>
</section>

<section class="view" id="pres" hidden>
  <div class="top"><button class="back" data-home>‹ 처음으로</button><span class="t"></span><span></span></div>
  <div class="result">
    <h2 id="rTitle">수고했어요</h2>
    <div class="big" id="rSpeed">0<small>타</small></div>
    <p class="lead" id="rLine"></p>
    <div class="stats">
      <div class="stat"><small>정확도</small><b id="rAcc">0%</b></div>
      <div class="stat"><small>가장 빠른 문장</small><b id="rTop">0타</b></div>
      <div class="stat"><small>전체 시간</small><b id="rTime">0초</b></div>
    </div>
    <button class="btn wide" id="rAgain">한 번 더</button>
  </div>
</section>

<section class="view" id="pos" hidden>
  <div class="top"><button class="back" data-home>‹ 처음으로</button><span class="t">자리 연습</span><span class="r" id="kStep">0 / 20</span></div>
  <div class="prog"><i id="kBar"></i></div>
  <div class="seg" role="radiogroup" aria-label="자판 종류">
    <label><input type="radio" name="lay" value="qw" checked>쿼티 자판</label>
    <label><input type="radio" name="lay" value="cj">천지인 자판</label>
  </div>
  <div class="chips" id="levels"></div>
  <div class="kbrow"><span>치는 법</span><div class="chips" id="hands"></div></div>
  <div class="kbrow" id="kbK"><span>내 자판</span><div class="chips kbc"></div></div>
  <div class="jamo" id="jBox">
    <div class="side"><b id="jHand">왼손 엄지</b><span id="jHow"></span></div>
    <div class="ch" id="jCh">ㅁ</div>
    <div class="side r"><b id="jSpd">–</b>글자당</div>
  </div>
  <div class="kb" id="kb"></div>
  <form class="typebox" id="kForm"><input type="text" id="kIn" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="보이는 자모를 치세요" placeholder="여기를 누르고 위 글자를 치세요"></form>
  <div class="rowc"><label class="tog">글자 대신 소리로 듣기<input type="checkbox" id="kSnd"></label><button type="button" class="btn ghost" id="kRep" hidden>다시 듣기</button></div>
  <label class="tog">자판 그림 숨기고 안 보고 치기<input type="checkbox" id="kHide"></label>
  <p class="note" id="kNote" hidden></p>
</section>

<section class="view" id="rain" hidden>
  <div class="top"><button class="back" data-home>‹ 처음으로</button><span class="t">낱말 퀴즈</span><span class="hearts" id="qLives">♥♥♥</span></div>
  <div class="prog"><i id="qBar"></i></div>
  <div class="chips" id="qModes"></div>
  <div class="chips" id="qTimes"></div>
  <div class="qcard" id="qCard">
    <span class="qtag" id="qTag">준비</span>
    <div class="qtext" id="qText">시작을 누르세요</div>
    <p class="qfb" id="qFb"></p>
    <button class="btn" id="qStart">시작</button>
  </div>
  <form class="typebox" id="gForm">
    <input type="text" id="gIn" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" aria-label="정답 입력" placeholder="정답을 치세요">
    <button class="btn" type="submit">확인</button>
  </form>
  <div class="rowc"><span class="hint" id="qScore">0점</span><button type="button" class="btn ghost" id="qSkip">넘기기</button></div>
</section>

</div>
<script>
{
const $=id=>document.getElementById(id);
// 한글 조합 중에 칸을 비우면 PC 한글 입력기가 조합 중이던 글자를 다음에 칠 때 앞에 다시 넣어요.
// 그래서 (1) 칸을 잠깐 놓았다가 다시 잡아 조합을 끝내고, (2) 그래도 그 글자가 되돌아오면 지워요.
// 폰 키보드는 이 문제가 없어서 PC에서만 적용해요 (폰 동작은 그대로).
let IMEON=false,IMEBUSY=false;
const IMEFIX=!/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)&&!(navigator.maxTouchPoints>1&&/Macintosh/.test(navigator.userAgent));
const STALE=new WeakMap();// 칸 → {s:되돌아올 수 있는 글자, hold:지금 막고 있는 중}
function unstale(el){const st=STALE.get(el);if(!st)return;STALE.delete(el);
  if(el.value.startsWith(st.s)){el.value=el.value.slice(st.s.length);el.dispatchEvent(new Event('input'))}}
document.addEventListener('compositionstart',()=>{IMEON=true},true);
document.addEventListener('compositionend',e=>{IMEON=false;if(IMEBUSY)return;const st=STALE.get(e.target);if(st&&st.hold)setTimeout(()=>unstale(e.target),0)},true);

function paint(v){
  const t=P.list[P.i];let h='';
  [...t].forEach((c,k)=>{let cl='',shown=c;if(k<v.length){cl=v[k]===c?'ok':(k===v.length-1?'':'bad')}else{if(k===v.length)cl='cur';if(PS&&c!==' '){shown='○';cl+=' hid'}}h+='<span class="'+cl+'">'+(shown===' '?'&nbsp;':esc(shown==='♥'?HEART[KB]:shown))+'</span>'});
  $('target').innerHTML=h;
}
function score(v){const t=P.list[P.i];let r=0;for(let k=0;k<Math.min(v.length,t.length);k++)if(v[k]===t[k])r++;return r}
function live(){
  if(!P||!P.t0)return;const v=norm($('pIn').value),sec=(performance.now()-P.t0)/1000,t=P.list[P.i];
  const sp=sec>0.5?Math.round(strokes(v)/sec*60):0;
  $('sSpeed').textContent=sp;$('sTime').textContent=Math.floor(sec)+'초';
  $('sAcc').textContent=v.length>1?Math.round(score(v.slice(0,-1))/Math.min(v.length-1,t.length)*100)+'%':'100%';
}

function finishSentence(){
  const v=norm($('pIn').value),t=P.list[P.i],sec=Math.max(0.5,(performance.now()-(P.t0||performance.now()))/1000);
  P.right+=score(v);P.total+=Math.max(t.length,v.length);P.totalTime+=sec;
  P.speeds.push(Math.round(strokes(t)*(score(v)/t.length)/sec*60));
  P.i++;

}

const saveK=()=>{try{localStorage.setItem('ptype-pos',JSON.stringify({lay:K.lay,lv:K.lv,hide:K.hide,snd:K.snd,hand:K.hand}))}catch(e){}};
function openPos(){show('pos');document.querySelector('input[name=lay][value='+K.lay+']').checked=true;$('kHide').checked=K.hide;$('kSnd').checked=K.snd;$('kRep').hidden=!K.snd;renderLevels();newRound();$('kIn').focus()}
function renderHands(){$('hands').innerHTML=[['one','한 손가락'],['two','두 엄지']].map(([k,n])=>'<button type="button" data-h="'+k+'" class="'+(k===K.hand?'on':'')+'">'+n+'</button>').join('')}
$('hands').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;K.hand=b.dataset.h;saveK();renderHands();if(!K.over)showJamo();$('kIn').focus()});
function renderLevels(){renderHands();$('levels').innerHTML=LV[K.lay].map((l,i)=>'<button type="button" data-lv="'+i+'" class="'+(i===K.lv?'on':'')+'">'+esc(l[0])+'</button>').join('')}
$('levels').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;K.lv=+b.dataset.lv;saveK();renderLevels();newRound();$('kIn').focus()});
document.querySelectorAll('input[name=lay]').forEach(r=>r.addEventListener('change',()=>{K.lay=r.value;K.lv=0;saveK();renderLevels();newRound();$('kIn').focus()}));
$('kSnd').addEventListener('change',()=>{K.snd=$('kSnd').checked;saveK();$('kRep').hidden=!K.snd;if(!K.snd)$('kNote').hidden=true;if(!K.over)showJamo();$('kIn').focus()});
$('kRep').addEventListener('click',()=>{if(!K.over)say(NAMES[K.q[K.i]]||K.q[K.i],'kNote');$('kIn').focus()});
$('kHide').addEventListener('change',()=>{K.hide=$('kHide').checked;saveK();drawKb();$('kIn').focus()});
function newRound(){const set=[...LV[K.lay][Math.min(K.lv,LV[K.lay].length-1)][1]];let q=[],prev='';for(let i=0;i<20;i++){let c;do{c=set[Math.random()*set.length|0]}while(c===prev&&set.length>1);q.push(c);prev=c}
  K.q=q;K.i=0;K.t0=0;K.last=0;K.err=0;K.times=[];K.over=false;clearIn($('kIn'));$('jSpd').textContent='–';showJamo()}
function showJamo(){
  const t=K.q[K.i];$('jCh').textContent=K.snd?'?':t;$('jCh').className='ch';
  if(K.snd)say(NAMES[t]||t,'kNote');
  $('kStep').textContent=K.i+' / 20';$('kBar').style.width=(K.i/20*100)+'%';
  const v=VOW.includes(t);
  if(K.lay==='qw'){
    const base=SHIFT[t]||t,ri=QW.findIndex(r=>r.includes(base)),row=QW[ri].filter(k=>k!=='⇧'&&k!=='⌫'),ci=row.indexOf(base);
    const one=K.hand==='one',pos=one||!v?'왼쪽에서 '+(ci+1)+'번째':'오른쪽에서 '+(row.length-ci)+'번째';
    $('jHand').textContent=['윗줄','가운뎃줄','아랫줄'][ri]+(one?'':' '+(v?'오른손':'왼손')+' 엄지');
    $('jHow').textContent=(ri===0&&KB==='sam'?'숫자 바로 아래 줄 · ':'')+(SHIFT[t]?'⇧ 누르고 ':'')+pos;
  }else if(v){
    $('jHand').textContent='맨 윗줄';
    $('jHow').textContent=[...CJV[t]].map(c=>c+'('+({'ㅣ':'왼쪽','·':'가운데','ㅡ':'오른쪽'}[c])+')').join(' → ');
  }else{
    const ki=CJK.findIndex(k=>k.includes(t)),key=CJK[ki],r=Math.floor(ki/3),c=ki%3;
    $('jHand').textContent=['맨 윗줄','둘째 줄','셋째 줄','넷째 줄'][r]+' '+['왼쪽','가운데','오른쪽'][c];
    $('jHow').textContent=key[0]+key[1]+' 키 '+(key[1]===t?'두 번':'한 번');
  }
  drawKb();
}
function drawKb(){
  const kb=$('kb'),t=K.over?'':K.q[K.i];kb.classList.toggle('off',K.hide);
  if(K.lay==='qw'){kb.className='kb'+(K.hide?' off':'');const base=SHIFT[t]||t;
    kb.innerHTML=(KB==='sam'?'<div class="kr">'+[...'1234567890'].map(n=>'<span class="k num">'+n+'</span>').join('')+'</div>':'')+QW.map(r=>'<div class="kr">'+r.map(k=>'<span class="k'+(k==='⇧'||k==='⌫'?' wd':'')+((k===base&&t)||(k==='⇧'&&SHIFT[t])?' hl':'')+'">'+k+'</span>').join('')+'</div>').join('')}
  else{kb.className='kb cj'+(K.hide?' off':'');const seq=VOW.includes(t)?CJV[t]||'':'';
    kb.innerHTML=CJK.map(k=>'<span class="k'+(k.length?'':' e')+((t&&(k.includes(t)||(seq&&seq.includes(k[0]))))?' hl':'')+'">'+(k.join('')||'&nbsp;')+'</span>').join('')}
}
$('kIn').addEventListener('input',e=>{
  if(IMEBUSY||K.over||(e.inputType||'').startsWith('delete'))return;
  const v=$('kIn').value;if(!v)return;const j=lastJamo(v),t=K.q[K.i],now=performance.now();
  if(!K.t0){K.t0=now;K.last=now}
  if(j===t){
    if(K.i>0||K.times.length)K.times.push(now-K.last);K.last=now;
    $('jCh').textContent=t;$('jCh').className='ch okf';K.i++;
    if(K.times.length)$('jSpd').textContent=(K.times.reduce((a,b)=>a+b,0)/K.times.length/1000).toFixed(2)+'초';
    clearIn($('kIn'));
    if(K.i>=20)return endPos();
    setTimeout(()=>{if(!K.over)showJamo()},K.snd?350:120);
  }else if(K.lay==='qw'){K.err++;$('jCh').className='ch badf';setTimeout(()=>{clearIn($('kIn'));if(!K.over)$('jCh').className='ch'},180)}
  else if([...v].length>3)clearIn($('kIn'));
});
$('kForm').addEventListener('submit',e=>{e.preventDefault();if(K.over){newRound()}});
function endPos(){
  K.over=true;$('kBar').style.width='100%';$('kStep').textContent='20 / 20';
  const avg=K.times.reduce((a,b)=>a+b,0)/Math.max(1,K.times.length)/1000,acc=Math.round(20/(20+K.err)*100);
  const key=K.lay+K.lv,old=(rec.pos||{})[key];
  if(!old||avg<old){rec.pos=Object.assign({},rec.pos,{[key]:+avg.toFixed(2)});saveRec()}
  $('jCh').textContent='끝';$('jCh').className='ch okf';$('jHand').textContent=avg.toFixed(2)+'초';
  $('jHow').textContent=(K.lay==='qw'?'정확도 '+acc+'%':'글자당 평균')+(old&&avg<old?' · 최고 기록!':'')+(K.hand==='one'&&K.lay==='qw'&&avg<1.2&&acc>=90?' · 이제 두 엄지로 쳐 볼까요?':'');
  $('jSpd').textContent='다시 하려면';drawKb();
  $('kIn').placeholder='엔터를 누르거나 단계를 고르세요';
}
showRecs();
}
</script>
</body>
